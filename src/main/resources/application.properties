spring.application.name=mediturnos-backend

# ===================================
# CONFIGURACIÓN DE LA BASE DE DATOS (MariaDB Remota)
# ===================================
spring.datasource.url=jdbc:mariadb://localhost:3306/mediturnos_db?allowPublicKeyRetrieval=true&useSSL=falseC
spring.datasource.username=mediturnos
spring.datasource.password=mediturnosprog4
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# 'update' actualiza las tablas automáticamente según tus entidades.
# En producción se suele usar 'validate' o herramientas como Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# ===================================
# CONFIGURACIÓN DEL SERVIDOR
# ===================================
server.port=8080

# ===================================
# PROPIEDADES PERSONALIZADAS PARA JWT (Opcional pero recomendado)
# ===================================
# Llave secreta en Base64 (debe ser suficientemente larga y segura)
jwt.secret=f7lJmM03RLQEjev4sCaKkvjCYJPaBsf4xepLFTEdVS1bdTn9AaWQOP6WjbohobDZLYtZ5I+FJkXWBOwYnEqX6A==
# Tiempo de expiración en milisegundos (ej. 24 horas = 86400000 ms)
jwt.expiration=86400000
